; Adrena GUI theme, format 1: a folder of themes/ holding this file, the folder's name its id. A folder named
; like a built-in replaces it. Keys left out, or that cannot be read, keep the base's value; keys this GUI does not
; know are left for others (rEden's ErET reads the same file). A comment takes a line of its own. docs/GUI.md
; describes every key.
[theme]
format = 1
name = Papel
author = Adrena
; ErET's drawing for it (plain | debug | loading | menu | skip); a base when no base names one
layout = debug
; default | yorha
base = default

[colors]
; the menus, #RRGGBB. soft: hints and secondary text; focus: the focused line, or its band; dim: rules
; paper and ink: the boxes are cards on a desk, their shadow a fold of the page
page = #F3EFE6
ink = #2B2822
soft = #6D6558
focus = #1B6E8C
active = #17564A
failure = #B3402F
dim = #C6BEAB
; a run being aborted, the question
warning = #A06B12
; a diff's added lines, as failure its removed ones; no screen uses it yet
added = #3F8F5F

[head]
; plain | bar: the tabs and the title on a band of ink; rule: a line under the head
style = plain
rule = true
; the title's letters, times the text's (1 to 3), and a shadow under them in the dim colour
size = 1
shadow = false
; the user at the head's right, their nickname and picture in a box: none | square | round
picture = round
; the title of each screen, empty for none; a steps run's title word
menu = ADRENA  /  MENÚ
games = ADRENA  /  JUEGOS
keys = ADRENA  /  LLAVES
compiling = COMPILANDO
loading = ARRANCANDO

[body]
; before each item; quotes keep spaces
marker = "- "
; the focused box: color | bar
focus = color
; the boxes outline (framed) or fill (filled)
panels = fill
; the boxes' and the focused rows' corners, pixels at the text's size; 0: square
radius = 10
; a box's shadow in the dim colour, under it and to its right; 0: none
shadow = 4
; a filled box's colour, this many of 255 of the way from the page to the ink
tint = 22
; a text too long for its box: wrap (over its rows) | slide (on one row)
text = wrap
; in the margin, beside the focused box
cursor =
; a question and its choices: default (a box in the middle) | yorha (the question in a box at the foot, the
; choices at its right above it)
options-dialog = default

[backdrop]
; a faint grid on the page behind the boxes, in the dim colour
grid = false

[tips]
; in a box with a bar at its left, or on the page
box = false
; over the foot's rows, or on one row that slides
wrap = false

[footer]
; plain | bar: on a band of ink | none: no Status box; rule: a line over the foot
style = plain
rule = true
; the keys in a box with a bar at its left, or on the page
box = true

[run]
; console: the driver's output as it comes; steps: a loading screen, in the colours below
layout = console
page = #F3EFE6
ink = #2B2822
soft = #6D6558
dim = #C6BEAB
failure = #B3402F
; a run being aborted
warning = #A06B12
; faint lines over the page; the progress bar and its percentage
texture = false
bar = true
; detailed: each step's other lines under it; collapse: a done step's folded away, a failed one's kept
detailed = false
collapse = false
; a running step's progress on its line: amount (3 / 6, 1.2 / 4.0 GB) | percent | time (left, at its pace so far)
progress = amount
; none | left | right | right-near-text
ring = none

[prompt]
; a line that waits on the user, when its key below is true: framed by open and close, placed left | center |
; right on its row, blinking at blink_ms (blink = false: steady). False keeps the line plain, at the left
align = center
open = "[ "
close = " ]"
blink = true
; keys: the keys screen's drop line; done and failed: the ESC line after a run; aborting: a run being aborted
keys = true
done = false
failed = false
aborting = false

[transitions]
; milliseconds, 0 to 10000; 0 turns the thing off. fade_out_ms: the menu as a run starts, and a run ESC
; leaves; fade_in_ms: what comes after
fade_in_ms = 240
fade_out_ms = 120
; how a step's line comes in: none | typing | slide | fade
line_in = fade
line_in_ms = 160
typing_ms = 25
; async: every line types from when it comes; sync: one at a time. A running step's newest line
; types a character each typing_ms, any other line whole in typing_ms
typing = async
blink_ms = 600
; a line too long for its row (big letters) slides left a column every scroll_ms and back; 0 cuts it
scroll_ms = 0

[splash]
; the boot's: Adrena's mark (a drawing of dist/splash, one of them at random with none), on page for ms milliseconds
; (0: none). chance: the boots in 100 that show this theme's, the default theme's the others
page = #F3EFE6
ms = 1600
chance = 0
